    const Cloud = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>;

    const Activity = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
    const Code = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>;
    const Database = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>;
    const Shield = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
    const Wrench = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>;

    // --- ANIMATED BACKGROUND ---
    const AnimatedBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        let animationFrameId;
        let particles =[];

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          initParticles();
        };

        const initParticles = () => {
          particles =[];
          const numParticles = Math.min(Math.floor(window.innerWidth / 25), 60);
          for (let i = 0; i < numParticles; i++) {
            particles.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 0.4,
              vy: (Math.random() - 0.5) * 0.4,
              radius: Math.random() * 1.5 + 0.5,
            });
          }
        };

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const isReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            if (!isReducedMotion) {
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
              if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(148, 163, 184, 0.4)";
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 110) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(148, 163, 184, ${0.15 - dist / 1000})`;
                ctx.stroke();
              }
            }
          }

          if (!isReducedMotion) {
            animationFrameId = requestAnimationFrame(draw);
          }
        };

        window.addEventListener("resize", resize);
        resize();
        draw();

        return () => {
          window.removeEventListener("resize", resize);
          cancelAnimationFrame(animationFrameId);
        };
      },[]);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-[-1]"
          style={{ background: "radial-gradient(circle at top left, #0f172a 0%, #020617 100%)" }}
        />
      );
    };

    // --- DATA ---

                    className="h-full bg-blue-500"
                  />
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>

          {!loading && (
            <main className="relative z-10 flex flex-col items-center w-full px-6 py-20 mx-auto max-w-5xl">
              
              {/* HERO */}

                <motion.div initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8 }}>
                  <h2 className="text-blue-400 font-mono mb-4 flex items-center gap-2 text-lg">
                    <Terminal size={20} /> Hello, I am
                  </h2>
                  <h1 className="text-5xl md:text-7xl font-extrabold text-white tracking-tight mb-4 drop-shadow-lg">
                    Omkar Patil
                  </h1>
                  <h3 className="text-xl md:text-3xl text-slate-300 font-medium mb-6 leading-relaxed max-w-3xl">
                    MSc Cloud Computing Graduate <br className="hidden md:block"/> 
                    <span className="text-slate-400 text-lg md:text-2xl">DevOps • Cloud Engineer Aspirant</span>
                  </h3>
                  
                  <div className="bg-slate-900/50 border border-slate-800/80 p-6 md:p-8 rounded-2xl backdrop-blur-md mb-10 max-w-3xl">
                    <p className="text-slate-300 text-lg leading-relaxed mb-4">
                      I’m a Cloud Computing graduate with hands-on experience building and deploying cloud-native applications using <span className="text-blue-300 font-medium">Python, Docker, AWS, Kubernetes, Linux,</span> and monitoring tools.

                  <div className="flex flex-col sm:flex-row gap-4">

                    <a href="mailto:patilomkar970@gmail.com" className="flex items-center justify-center gap-2 bg-slate-800/50 hover:bg-slate-800 text-white border border-slate-700 px-8 py-4 rounded-xl font-medium transition-all backdrop-blur-sm">

              </section>

              {/* HIGHLIGHTS STRIP */}

              {/* SKILLS SECTION */}

                </div>
                
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {skillCategories.map((category, idx) => (
                    <motion.div

              {/* EDUCATION & CERTIFICATIONS */}
              <section className="w-full py-20 mb-10">
                <div className="grid md:grid-cols-2 gap-10">
                  
                  {/* EDUCATION */}
                  <div>
                    <div className="flex items-center gap-4 mb-8">

                    </div>
                    <div className="p-8 bg-slate-900/40 border border-slate-800 rounded-2xl backdrop-blur-md relative overflow-hidden">
                      <div className="absolute top-0 right-0 p-4 opacity-10"><GraduationCap size={100} /></div>
                      <h3 className="text-2xl font-bold text-white mb-2 relative z-10">Newcastle University</h3>

                </div>
              </section>

              {/* FOOTER */}

                <p>© {new Date().getFullYear()} Omkar Patil. All rights reserved.</p>
                <div className="flex gap-6 mt-4 md:mt-0">
                  <a href="mailto:patilomkar970@gmail.com" className="hover:text-blue-400 transition-colors flex items-center gap-2">📧 Email</a>
                  <a href="https://linkedin.com/in/omkar-patil15" target="_blank" className="hover:text-blue-400 transition-colors flex items-center gap-2">💼 LinkedIn</a>
                </div>
              </footer>
            </main>
          )}
        </React.Fragment>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Portfolio />);
  </script>
</body>
